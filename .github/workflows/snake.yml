name: generate contribution snake

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake grids
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 1mp3ctz
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7c3aed
            dist/github-snake-dark.svg?color_snake=#22d3ee&color_dots=#161b22,#312e81,#6d28d9,#8b5cf6,#f472b6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push snakes to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
