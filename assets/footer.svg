    <text x="500" y="54" text-anchor="middle" font-family="'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,monospace" font-size="13.5" fill="#91A4C9" letter-spacing="1.5">· designed &amp; animated by my own ai agents ·</text>
