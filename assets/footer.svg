      <circle cx="240" cy="48" r="0.8" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.2s" begin="-2.1s" repeatCount="indefinite"/></circle>
      <circle cx="410" cy="26" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.1;0.95;0.1" dur="2.7s" begin="-1.4s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="40" r="0.8" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.8s" begin="-0.4s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="24" r="1" opacity="0.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.3s" begin="-2.7s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="44" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.9s" begin="-1.7s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="20" r="0.7" opacity="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.5s" begin="-3.2s" repeatCount="indefinite"/></circle>
