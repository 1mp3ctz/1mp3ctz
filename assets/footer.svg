    <path d="M0,86 Q125,60 250,86 T500,86 T750,86 T1000,86 T1250,86 T1500,86 T1750,86 T2000,86 T2250,86 T2500,86 L2500,150 L0,150 Z" fill="url(#fw3)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M0,96 Q125,66 250,96 T500,96 T750,96 T1000,96 T1250,96 T1500,96 T1750,96 T2000,96 T2250,96 T2500,96 L2500,150 L0,150 Z" fill="url(#fw1)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M0,108 Q125,138 250,108 T500,108 T750,108 T1000,108 T1250,108 T1500,108 T1750,108 T2000,108 T2250,108 T2500,108 L2500,150 L0,150 Z" fill="url(#fw2)">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="14s" repeatCount="indefinite"/>
