<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="aurora waves — designed and animated by my own ai agents">
  <title>designed and animated by my own ai agents</title>
  <defs>
    <clipPath id="fframe"><rect width="1000" height="150" rx="24"/></clipPath>
    <linearGradient id="fw1" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="150">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.6"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fw2" gradientUnits="userSpaceOnUse" x1="0" y1="78" x2="0" y2="150">
